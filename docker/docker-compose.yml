services:
  caddy:
    image: caddy:2.8.4-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - drop-relay
    restart: unless-stopped

  drop-relay:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    expose:
      - "3000"
    user: "node" # Run container as non-root user
    environment:
      - NODE_ENV=production
      - PORT=3000
      - COTURN_AUTH_SECRET=drop_production_coturn_secret_2026
      - TURN_SERVER_URL=${PUBLIC_TURN_URL:-turn:127.0.0.1:3478}
    volumes:
      - drop-chunks:/app/.drop_chunks
    restart: unless-stopped

  turn:
    image: coturn/coturn:4.6.2-alpine # Pinned image tag
    network_mode: "host"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    restart: unless-stopped

volumes:
  drop-chunks:
  caddy-data:
  caddy-config:
