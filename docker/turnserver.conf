# Coturn TURN Server Configuration for Drop
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=drop_production_coturn_secret_2026
realm=drop.local
total-quota=100
bps-capacity=0
stale-nonce
no-loopback-peers
no-multicast-peers

# Deny internal private IP ranges to prevent SSRF and internal LAN snooping
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

min-port=49152
max-port=65535
verbose
